# Maps changed paths to PR labels (used by workflows/pr-labels.yml).
# Adapt the label names and globs to the target repo's layout, and make sure
# each label exists in the repo (see scripts/apply-labels.sh).
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "**/*.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

