# Rules and scope live in .markdownlint-cli2.jsonc, so CI and local runs match.
# Action is SHA-pinned (Dependabot keeps it current).
name: Markdown Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
