# Moves the PR's project item: draft -> "In Progress", ready -> "To Review".
#
# "Closed -> Done" is left to the board's built-in workflow on purpose.
#
# Setup (both required, workflow no-ops without them):
#   - Repo variable PROJECT_URL, e.g. https://github.com/orgs/acme/projects/3
#   - Repo secret PROJECTS_TOKEN. Org-owned project: fine-grained PAT owned by
#     the org, with Projects read/write plus Pull requests read on this repo
#     (the mutation has to resolve the PR node). User-owned project: classic
#     PAT with `project` and `repo` scopes, since fine-grained PATs cannot
#     access user projects. GITHUB_TOKEN cannot write projects at all.
name: PR Project Status

on:
  pull_request:
    types: [opened, reopened, converted_to_draft, ready_for_review]

permissions: {}

# Rapid event pairs (open draft, then mark ready) race; let the newest win.
concurrency:
  group: pr-project-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      PROJECT_URL: ${{ vars.PROJECT_URL }}
      PR_NODE_ID: ${{ github.event.pull_request.node_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - name: Set project item status
        if: env.GH_TOKEN != '' && env.PROJECT_URL != ''
        run: |
          set -euo pipefail

          if [[ "$PROJECT_URL" =~ github\.com/(orgs|users)/([^/]+)/projects/([0-9]+) ]]; then
            OWNER="${BASH_REMATCH[2]}"
            NUMBER="${BASH_REMATCH[3]}"
          else
            echo "::error::PROJECT_URL is not a project URL: $PROJECT_URL"
            exit 1
          fi

          if [ "$IS_DRAFT" = "true" ]; then STATUS="In Progress"; else STATUS="To Review"; fi

          # External jq, not gh --jq: on GraphQL errors gh prints the raw
          # response body unfiltered, which would defeat the guard below.
          PROJECT_JSON="$(gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              repositoryOwner(login: $owner) {
                ... on ProjectV2Owner {
                  projectV2(number: $number) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -F number="$NUMBER" 2>/dev/null \
            | jq -c '.data.repositoryOwner.projectV2 // empty' 2>/dev/null || true)"

          if [ -z "$PROJECT_JSON" ]; then
            echo "::error::Project not found or PROJECTS_TOKEN lacks access: $PROJECT_URL"
            exit 1
          fi

          PROJECT_ID="$(jq -r '.id // empty' <<<"$PROJECT_JSON")"
          FIELD_ID="$(jq -r '.field.id // empty' <<<"$PROJECT_JSON")"
          if [ -z "$FIELD_ID" ]; then
            echo "::error::Project has no single-select 'Status' field: $PROJECT_URL"
            exit 1
          fi
          OPTION_ID="$(jq -r --arg s "$STATUS" '.field.options[]? | select(.name == $s) | .id' <<<"$PROJECT_JSON")"

          if [ -z "$OPTION_ID" ]; then
            echo "::error::Status option '$STATUS' not found in project $PROJECT_URL"
            exit 1
          fi

          # Idempotent: returns the existing item if the PR is already on the board.
          ITEM_ID="$(gh api graphql -f query='
            mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                item { id }
              }
            }' -f project="$PROJECT_ID" -f content="$PR_NODE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')"

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: {singleSelectOptionId: $option}
              }) { projectV2Item { id } }
            }' -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$FIELD_ID" -f option="$OPTION_ID" >/dev/null

          echo "PR #$PR_NUMBER -> $STATUS"
