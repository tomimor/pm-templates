# Assigns the PR author as the assignee when a PR is opened/reopened.
# Action is SHA-pinned (Dependabot keeps it current).
name: Auto Author Assign

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - uses: toshimaru/auto-author-assign@a78a94b219445cece8ccf0d45fec60af449f212a # v3.1.0
