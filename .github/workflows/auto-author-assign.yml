# Assigns the PR author as the assignee when a PR is opened/reopened.
# Action is SHA-pinned (Dependabot keeps it current).
name: Auto Author Assign

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - uses: toshimaru/auto-author-assign@3e19bfc990cb1cf0589dce95e9f75289bb1e22de # v3.0.3
